name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode Android FIT records and summaries
        run: |
          python -m pip install fit-tool==0.9.16
          javac --release 17 -encoding UTF-8 -d android/smoke-classes android/app/src/main/java/com/natsume/fitgenerator/FitEncoder.java android/app/src/main/java/com/natsume/fitgenerator/Route.java android/app/src/main/java/com/natsume/fitgenerator/GpxParser.java android/tools/EncoderSmoke.java
          java -cp android/smoke-classes com.natsume.fitgenerator.EncoderSmoke android-auto.fit android-route.fit android-custom.fit android-route-custom.fit
          python android/tools/verify_encoder.py android-auto.fit android-route.fit android-custom.fit android-route-custom.fit
      - name: Build and lint installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fit-file-generator-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
