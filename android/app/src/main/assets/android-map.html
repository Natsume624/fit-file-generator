<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <title>地图校准 · FIT 文件生成器</title>
 <link rel="stylesheet" href="vendor/leaflet.css">
 <link rel="stylesheet" href="android-map.css">
</head>
<body>
 <main><div id="map"></div><div class="map-badge">无需 API Key · WGS84</div><div id="offline" hidden>底图暂不可用，仍可调整跑道</div></main>
 <section class="sheet">
  <div class="handle"></div>
  <div class="eyebrow">NATSUME / MAP CALIBRATION</div>
  <h1 id="hero">把跑道放到正确的位置。</h1>
  <p id="intro">搜索学校或体育场，然后点击实际跑道中心。拖动蓝点可微调。</p>
  <form id="searchForm"><div class="search"><input id="query" placeholder="学校 / 体育场 / 城市" maxlength="120"><button id="searchButton">查找</button></div></form>
  <div id="results"></div>
  <div id="editor">
   <div class="heading"><h2>跑道轮廓</h2><output id="angleText">0°</output></div>
   <label for="bearing">方向</label><input id="bearing" type="range" min="0" max="360" step="0.1" value="0">
   <div class="pair"><label>直道 / 米<input id="straight" type="number" min="1" max="1000" step="0.01" value="84.39"></label><label>半径 / 米<input id="radius" type="number" min="5" max="300" step="0.01" value="36.8"></label></div>
   <div id="summary" class="summary"></div>
   <div class="buttons"><button id="place" class="secondary" type="button">移到画面中心</button><button id="apply" class="primary" type="button">应用校准</button></div>
  </div>
  <div id="routeInfo" hidden><h2>GPX 原始路线</h2><p id="routeName"></p><p>绿色为起点，橙色为终点。路线保持原经纬度。</p></div>
  <p id="status" role="status" aria-live="polite">正在加载地图…</p>
  <div class="credits">地图 © OpenStreetMap contributors · 地点搜索 Photon</div>
 </section>
 <script src="vendor/leaflet.js"></script>
 <script src="android-map.js"></script>
</body>
</html>
